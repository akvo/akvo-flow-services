version: "3"
services:
  mainnetwork:
    image: alpine
    command: tail -f /dev/null
  gae-dev-server:
    build: gae-dev-server
    network_mode: service:mainnetwork
    volumes:
      - ~/.m2:/opt/m2/
  flow-services:
    network_mode: service:mainnetwork
    environment:
      - HOST_UID
      - HOST_GID
      - APP_VERSION=some.version
  wiremock-proxy:
    image: rodolpheche/wiremock:2.16.0-alpine
  # Catches the report-ready notifications. dev/config.edn points the relay at
  # its SMTP port (1025); the end-to-end tests read what arrived back off its
  # HTTP API (8025). No credentials, so EMAIL_HOST_USER/PASSWORD stay unset --
  # postal only attempts an AUTH handshake when a user is present.
  mailpit:
    image: axllent/mailpit:v1.29.7
  aws-s3:
    image: abhin4v/hastatic:0.10.0
    environment:
      - PORT=3005
    command: /usr/bin/hastatic
    working_dir: /s3
    volumes:
      - ./s3:/s3:ro
